server:
  port: 8083
  forward-headers-strategy: framework

spring:
  application:
    name: ledger-service
  messages:
    basename: error
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/fintech_wallet_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:MangoTree@08}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:ZmluVGVjaExlZGdlckp3dFNlY3JldEtleVRoaXNJc1ZlcnlMb25nQW5kU2VjdXJlRm9yUHJvZHVjdGlvbjIwMjU=}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    com.fintech.ledger: DEBUG
    com.fintech.ledger.config: INFO
    com.fintech.ledger.api: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n"
  file:
    name: logs/ledger-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
